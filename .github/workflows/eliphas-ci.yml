# Eliphas: lint, typecheck, unit tests and a production build on every pull request and push to main.
# No secrets are used: the build runs with placeholder settings and never talks to Supabase or Razorpay.
name: Eliphas checks

on:
  pull_request:
    paths: ["eliphas/**", ".github/workflows/eliphas-ci.yml"]
  push:
    branches: [main]
    paths: ["eliphas/**", ".github/workflows/eliphas-ci.yml"]

permissions:
  contents: read

concurrency:
  group: eliphas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eliphas
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: eliphas/.nvmrc
          cache: npm
          cache-dependency-path: eliphas/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: npm run build
