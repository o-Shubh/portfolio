<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17214a" />
    <title>You're offline · Eliphas Indicus</title>
    <style>
      :root { --bg: #f3f4f7; --fg: #17214a; --muted: #5a6386; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0f26; --fg: #f3f4f7; --muted: #a9b0cc; color-scheme: dark; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 17px/1.6 system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font: 600 1.8rem/1.2 Georgia, serif; letter-spacing: -0.02em; margin: 20px 0 8px; }
      p { color: var(--muted); margin: 0 auto; max-width: 22rem; }
      button { margin-top: 24px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
        background: #c98200; color: #2e1e00; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your internet connection. Your books and orders will be here when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
