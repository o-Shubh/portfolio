<!-- Eliphas sign-in email. Paste into Supabase → Authentication → Email Templates → "Magic link" AND "Confirm signup". -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #1d1d1f; max-width: 480px; margin: 0 auto; padding: 24px">
  <p style="font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #6e6e73; margin: 0 0 8px">Eliphas Indicus Publications</p>
  <h1 style="font-size: 22px; margin: 0 0 16px">Your sign-in code</h1>
  <p style="margin: 0 0 12px">Enter this code on the sign-in page:</p>
  <p style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 32px; letter-spacing: 0.3em; font-weight: 600; margin: 0 0 20px">{{ .Token }}</p>
  <p style="margin: 0 0 20px">Or tap this button on the same device: <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #17214a; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 600">Sign in</a></p>
  <p style="font-size: 13px; color: #6e6e73; margin: 0">The code works once and expires soon. If you didn't ask to sign in, you can ignore this email.</p>
</div>
